<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marble Machine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <h1>Marble Machine</h1>
      <p>Watch the marble roll down a rectangular ramp from left to right.</p>

      <section class="marble-frame" aria-label="Animated marble machine">
        <div class="track" aria-hidden="true">
          <div class="ramp"></div>
          <div class="ramp-edge"></div>
        </div>
        <div class="marble" role="img" aria-label="Blue glass marble"></div>
      </section>
    </main>
  </body>
</html>
